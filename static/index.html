<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic RAG Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center py-10 px-4">

    <div class="w-full max-w-4xl bg-gray-800 rounded-2xl shadow-xl p-8 border border-gray-700">
        <header class="mb-6 text-center">
            <h1 class="text-3xl font-bold text-emerald-400">Academic RAG Assistant</h1>
            <p class="text-sm text-gray-400 mt-1">Llama 3 • Locale</p>
        </header>

        <div class="mb-8 p-5 bg-indigo-950/40 rounded-xl border border-indigo-500/30 text-sm text-gray-300 leading-relaxed">
            <p>
                Strumento RAG locale per la ricerca di citazioni, definizioni e dati all'interno di paper e documenti di tesi. 
                Seleziona un PDF per indicizzarlo automaticamente ed estrarre informazioni con supporto offline (Llama 3 + ChromaDB).
            </p>
        </div>

        <div class="mb-8 p-6 bg-gray-900/50 rounded-xl border border-gray-700">
            <label class="block text-sm font-semibold mb-3 text-indigo-400">Documento di riferimento (PDF)</label>
            <input type="file" id="pdfFile" accept=".pdf" onchange="autoProcessPDF()" class="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer">
            <p id="uploadStatus" class="text-sm mt-3 text-gray-400"></p>
        </div>

        <div class="p-6 bg-gray-900/50 rounded-xl border border-gray-700">
            <label class="block text-sm font-semibold mb-3 text-indigo-400">Interroga il documento</label>
            <div class="flex gap-3 mb-4">
                <input type="text" id="questionInput" placeholder="Cerca una definizione o un dato..." class="flex-grow bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-gray-100 focus:outline-none focus:border-indigo-500">
                <button onclick="askQuestion()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-6 py-2 rounded-lg transition">Cerca</button>
            </div>
            
            <div id="responseContainer" class="hidden mt-4 p-5 bg-gray-800 rounded-lg border border-gray-700">
                <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-400 mb-2">Risposta</h3>
                <div id="answerText" class="text-gray-200 whitespace-pre-line leading-relaxed text-sm bg-gray-900/40 p-4 rounded-lg border border-gray-700/50"></div>
                
                <h3 class="text-xs font-bold uppercase tracking-wider text-indigo-400 mt-6 mb-2">Fonti</h3>
                <div id="sourcesText" class="text-xs text-gray-400 space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        async function autoProcessPDF() {
            const fileInput = document.getElementById("pdfFile");
            const statusText = document.getElementById("uploadStatus");
            
            if (fileInput.files.length === 0) return;

            const file = fileInput.files[0];
            statusText.innerText = "Pulizia database...";
            statusText.className = "text-sm mt-3 text-yellow-400";

            try {
                await fetch(`${API_URL}/reset-db/`, { method: "DELETE" });

                statusText.innerText = `Caricamento di "${file.name}" in corso...`;

                const formData = new FormData();
                formData.append("file", file);

                const res = await fetch(`${API_URL}/upload-pdf/`, {
                    method: "POST",
                    body: formData
                });
                
                const data = await res.json();
                if (res.ok) {
                    statusText.innerText = `Pronto! Indicizzati ${data.chunks_created} chunk.`;
                    statusText.className = "text-sm mt-3 text-emerald-400";
                } else {
                    statusText.innerText = `Errore: ${data.detail}`;
                    statusText.className = "text-sm mt-3 text-red-400";
                }
            } catch (err) {
                statusText.innerText = "Errore di connessione al server.";
                statusText.className = "text-sm mt-3 text-red-400";
            }
        }

        async function askQuestion() {
            const questionInput = document.getElementById("questionInput");
            const responseContainer = document.getElementById("responseContainer");
            const answerText = document.getElementById("answerText");
            const sourcesText = document.getElementById("sourcesText");

            const question = questionInput.value.trim();
            if (!question) return;

            answerText.innerText = "Elaborazione in corso...";
            sourcesText.innerHTML = "";
            responseContainer.classList.remove("hidden");

            try {
                const res = await fetch(`${API_URL}/ask/`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question })
                });
                const data = await res.json();
                
                if (res.ok) {
                    answerText.innerText = data.response;
                    sourcesText.innerHTML = "";
                    data.sources.forEach((source, index) => {
                        const div = document.createElement("div");
                        div.className = "p-3 bg-gray-900/70 rounded-lg border border-gray-700/60 leading-relaxed font-mono text-gray-300";
                        div.innerText = `[${index + 1}]:\n${source}`;
                        sourcesText.appendChild(div);
                    });
                } else {
                    answerText.innerText = `Errore: ${data.detail}`;
                }
            } catch (err) {
                answerText.innerText = "Errore di connessione al server.";
            }
        }
    </script>
</body>
</html>
